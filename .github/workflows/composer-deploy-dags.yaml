name: Deploy DAGs to Composer

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/data_platform/dags/**'
      - 'src/data_platform/jobs/**'
      # Versão do pyphen publicada nos plugins (fill_flesch_ptbr)
      - 'poetry.lock'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: inspire-7-finep
  COMPOSER_ENVIRONMENT: destaquesgovbr-composer
  COMPOSER_REGION: southamerica-east1

jobs:
  deploy-dags:
    uses: destaquesgovbr/reusable-workflows/.github/workflows/composer-deploy-dags.yml@v1
    with:
      dags_local_path: src/data_platform/dags
      dags_bucket_subdir: data-platform

  deploy-plugins:
    name: Deploy plugins to Composer
    needs: deploy-dags
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990583792367/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@inspire-7-finep.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: inspire-7-finep

      - name: Get Composer plugins bucket
        id: composer
        run: |
          DAGS_BUCKET=$(gcloud composer environments describe ${{ env.COMPOSER_ENVIRONMENT }} \
            --location=${{ env.COMPOSER_REGION }} \
            --format="value(config.dagGcsPrefix)")
          PLUGINS_BUCKET=$(echo "$DAGS_BUCKET" | sed 's|/dags$|/plugins|')
          echo "plugins_bucket=$PLUGINS_BUCKET" >> $GITHUB_OUTPUT

      - name: Prepare plugins directory
        run: |
          # Only deploy job modules needed by Composer DAGs
          mkdir -p /tmp/plugins/data_platform/jobs
          mkdir -p /tmp/plugins/data_platform/typesense
          cp src/data_platform/jobs/__init__.py /tmp/plugins/data_platform/jobs/
          cp -r src/data_platform/jobs/bigquery /tmp/plugins/data_platform/jobs/
          cp -r src/data_platform/jobs/features /tmp/plugins/data_platform/jobs/
          cp -r src/data_platform/jobs/graph /tmp/plugins/data_platform/jobs/
          cp -r src/data_platform/jobs/integrity /tmp/plugins/data_platform/jobs/
          cp -r src/data_platform/jobs/similarity /tmp/plugins/data_platform/jobs/
          cp -r src/data_platform/jobs/thumbnail /tmp/plugins/data_platform/jobs/
          cp -r src/data_platform/jobs/trend_detection /tmp/plugins/data_platform/jobs/
          # Deploy only typesense modules needed by DAGs (skip indexer.py — depends on pandas)
          cp src/data_platform/typesense/client.py /tmp/plugins/data_platform/typesense/
          cp src/data_platform/typesense/collection.py /tmp/plugins/data_platform/typesense/
          touch /tmp/plugins/data_platform/typesense/__init__.py
          # Deploy shared utilities needed by DAGs
          cp src/data_platform/cloud_run.py /tmp/plugins/data_platform/
          # Create package __init__.py
          touch /tmp/plugins/data_platform/__init__.py

      # O Composer não tem pyphen (pacotes PyPI do ambiente vêm do Terraform). A task
      # fill_flesch_ptbr (aggregate_engagement) precisa dele: instala a versão travada no
      # poetry.lock (a mesma do feature-worker, puro Python) na raiz dos plugins, que está no
      # sys.path dos workers. Trocar a versão muda o dicionário e os valores do Flesch pt-BR.
      - name: Vendor pyphen into plugins
        run: |
          PYPHEN_VERSION=$(python3 -c "import tomllib; print(next(p['version'] for p in tomllib.load(open('poetry.lock', 'rb'))['package'] if p['name'] == 'pyphen'))")
          echo "pyphen==${PYPHEN_VERSION}"
          python3 -m pip install --no-deps --target /tmp/plugins_vendor "pyphen==${PYPHEN_VERSION}" --no-compile
          test -f /tmp/plugins_vendor/pyphen/dictionaries/hyph_pt_BR.dic

      - name: Deploy plugins to GCS
        run: |
          gsutil -m rsync -r -d \
            /tmp/plugins/data_platform/ \
            ${{ steps.composer.outputs.plugins_bucket }}/data_platform/
          gsutil -m rsync -r -d \
            /tmp/plugins_vendor/pyphen/ \
            ${{ steps.composer.outputs.plugins_bucket }}/pyphen/
