name: Deploy DAGs to Airflow

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/data_platform/dags/**'
      - 'src/data_platform/jobs/**'
      # Também vão para os plugins (importados pelas DAGs)
      - 'src/data_platform/typesense/**'
      - 'src/data_platform/cloud_run.py'
      # Versão do pyphen publicada nos plugins (fill_flesch_ptbr)
      - 'poetry.lock'
      - '.github/workflows/composer-deploy-dags.yaml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Um deploy por vez, inteiro (plugins e DAGs): os dois rsync apagam no destino, e sem isso os
# plugins de um run e as DAGs de outro se misturariam nos buckets. Com cancel-in-progress
# false o run em andamento termina e só o mais novo fica na fila. O nome não pode ser o do
# grupo do job de deploy do v3 (airflow-deploy-dags-<repo>-<subpasta>): seria um deadlock.
concurrency:
  group: data-platform-airflow-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: inspire-7-finep
  # Única lista de buckets do deploy (plugins e DAGs): só o do Airflow próprio (VM
  # destaquesgovbr-airflow), cujo dag-sync espelha dags/ e plugins/ na VM a cada 60 s. O
  # Composer foi desligado na Fase 7 da migração e o bucket dele
  # (southamerica-east1-destaque-227e22da-bucket) não recebe mais nada. O contexto env não
  # chega ao `with:` de workflow reutilizável, então o job de plugins repassa a lista ao
  # airflow-deploy-dags.yml@v3 como output, e o default de `buckets` do v3 não vale aqui.
  # Um bucket na lista que não exista mais faz o rsync dos plugins falhar, e as DAGs não são
  # publicadas em lugar nenhum.
  AIRFLOW_DAG_BUCKETS: "destaquesgovbr-airflow"

jobs:
  # Plugins antes das DAGs: no primeiro deploy no bucket novo as DAGs chegariam antes dos
  # módulos que elas importam.
  deploy-plugins:
    name: Deploy plugins (Airflow próprio)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      buckets: ${{ steps.buckets.outputs.buckets }}
    steps:
      # Sem a guarda o laço do rsync não roda e o job fica verde sem publicar nada.
      - name: Conferir buckets
        id: buckets
        run: |
          test -n "${AIRFLOW_DAG_BUCKETS// /}"
          echo "buckets=${AIRFLOW_DAG_BUCKETS}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      # A versão da imagem do Airflow próprio (infra/airflow/Dockerfile) e da validação do v3.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990583792367/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@inspire-7-finep.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: inspire-7-finep

      - name: Prepare plugins directory
        run: |
          # Only deploy job modules needed by the DAGs
          mkdir -p /tmp/plugins/data_platform/jobs
          mkdir -p /tmp/plugins/data_platform/typesense
          cp src/data_platform/jobs/__init__.py /tmp/plugins/data_platform/jobs/
          cp -r src/data_platform/jobs/bigquery /tmp/plugins/data_platform/jobs/
          cp -r src/data_platform/jobs/features /tmp/plugins/data_platform/jobs/
          cp -r src/data_platform/jobs/graph /tmp/plugins/data_platform/jobs/
          cp -r src/data_platform/jobs/integrity /tmp/plugins/data_platform/jobs/
          cp -r src/data_platform/jobs/similarity /tmp/plugins/data_platform/jobs/
          cp -r src/data_platform/jobs/thumbnail /tmp/plugins/data_platform/jobs/
          cp -r src/data_platform/jobs/trend_detection /tmp/plugins/data_platform/jobs/
          # Deploy only typesense modules needed by DAGs (skip indexer.py — depends on pandas)
          cp src/data_platform/typesense/client.py /tmp/plugins/data_platform/typesense/
          cp src/data_platform/typesense/collection.py /tmp/plugins/data_platform/typesense/
          touch /tmp/plugins/data_platform/typesense/__init__.py
          # Deploy shared utilities needed by DAGs
          cp src/data_platform/cloud_run.py /tmp/plugins/data_platform/
          # Create package __init__.py
          touch /tmp/plugins/data_platform/__init__.py

      # A validação do v3 (job deploy-dags) só roda com os plugins já publicados. Este passo
      # barra ao menos erro de sintaxe nas DAGs e nos plugins antes de publicar qualquer coisa.
      # Se a validação do v3 falhar depois (ex.: na instalação do Airflow), os plugins novos
      # ficam nos buckets com as DAGs antigas: rodar de novo os jobs que falharam.
      - name: Validar sintaxe das DAGs e dos plugins (py_compile)
        env:
          # Os .pyc vão para fora de /tmp/plugins, que é publicado.
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          find src/data_platform/dags /tmp/plugins/data_platform -type f -name '*.py' \
            -not -path '*/__pycache__/*' -print0 | sort -z | xargs -0 python -m py_compile
          test -z "$(find /tmp/plugins -name __pycache__ -print -quit)"

      # A imagem do Airflow próprio não tem pyphen (infra/airflow/requirements.txt o deixa de
      # fora de propósito). A task fill_flesch_ptbr (aggregate_engagement) precisa dele:
      # instala a versão travada no poetry.lock (a mesma do feature-worker, puro Python) na
      # raiz dos plugins, que está no sys.path das tasks. Trocar a versão muda o dicionário e
      # os valores do Flesch pt-BR.
      - name: Vendor pyphen into plugins
        run: |
          PYPHEN_VERSION=$(python3 -c "import tomllib; print(next(p['version'] for p in tomllib.load(open('poetry.lock', 'rb'))['package'] if p['name'] == 'pyphen'))")
          echo "pyphen==${PYPHEN_VERSION}"
          python3 -m pip install --no-deps --target /tmp/plugins_vendor "pyphen==${PYPHEN_VERSION}" --no-compile
          test -f /tmp/plugins_vendor/pyphen/dictionaries/hyph_pt_BR.dic

      # Layout gs://<bucket>/plugins/{data_platform,pyphen}/. O dag-sync do docker compose da
      # VM sincroniza gs://<bucket>/plugins para /opt/airflow/plugins, que está no sys.path.
      - name: Deploy plugins to GCS
        run: |
          for bucket in ${AIRFLOW_DAG_BUCKETS}; do
            echo "::group::gs://${bucket}/plugins"
            gcloud storage rsync --recursive --delete-unmatched-destination-objects \
              /tmp/plugins/data_platform/ \
              "gs://${bucket}/plugins/data_platform/"
            gcloud storage rsync --recursive --delete-unmatched-destination-objects \
              /tmp/plugins_vendor/pyphen/ \
              "gs://${bucket}/plugins/pyphen/"
            echo "::endgroup::"
          done

  deploy-dags:
    needs: deploy-plugins
    uses: destaquesgovbr/reusable-workflows/.github/workflows/airflow-deploy-dags.yml@v3
    with:
      dags_local_path: src/data_platform/dags
      dags_bucket_subdir: data-platform
      buckets: ${{ needs.deploy-plugins.outputs.buckets }}
