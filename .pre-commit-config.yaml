# Pre-commit hooks para data-platform
# Instalação: pre-commit install
# Execução manual: pre-commit run --all-files

default_language_version:
  python: python3.12

repos:
  # ============================================================================
  # FASE 1: FILE HYGIENE (< 1s)
  # Roda primeiro para feedback rápido em problemas básicos
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # File hygiene (previne problemas Windows/Mac em CI Linux)
      - id: trailing-whitespace
        name: Trim trailing whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        name: Ensure files end with newline
      - id: mixed-line-ending
        name: Normalize line endings to LF
        args: [--fix=lf]

      # Syntax validation (rápido, pega erros de parse)
      - id: check-yaml
        name: Validate YAML syntax
      - id: check-json
        name: Validate JSON syntax
      - id: check-toml
        name: Validate TOML syntax

      # Git hygiene
      - id: check-merge-conflict
        name: Check for merge conflict markers
      - id: check-case-conflict
        name: Check for case-insensitive filename conflicts

      # File size protection (previne commits acidentais de arquivos grandes)
      - id: check-added-large-files
        name: Check for files > 1MB
        args: [--maxkb=1024]
        exclude: ^(poetry\.lock|\.coverage)$

  # ============================================================================
  # FASE 2: SECURITY CHECKS (1-3s)
  # CRÍTICO: Previne vazamento de credenciais antes de chegar no remote
  # ============================================================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets and credentials
        args:
          - --baseline
          - .secrets.baseline
          - --exclude-files
          - 'poetry\.lock'
          - --exclude-files
          - '\.coverage'
          - --exclude-files
          - 'htmlcov/.*'
        exclude: ^(tests/.*|.*\.example)$

  # ============================================================================
  # FASE 3: SQL LINTING (3-5s)
  # CRÍTICO: 48 SQL files sem validação
  # ============================================================================
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.2.5
    hooks:
      - id: sqlfluff-lint
        name: Lint SQL files (PostgreSQL)
        args:
          - --dialect=postgres
          - --exclude-rules=LT01,LT02,LT03,LT04,LT05,LT06,LT07,LT08,LT09,LT10,LT11,LT12,LT13,CP01,CP02,CP03,CP04,CP05,AL01,AL02,AL03,AL04,AL05
          - --config=.sqlfluff
        files: ^scripts/migrations/.*\.sql$
        additional_dependencies: []

      - id: sqlfluff-lint
        name: Lint SQL files (BigQuery)
        args:
          - --dialect=bigquery
          - --exclude-rules=LT01,LT02,LT03,LT04,LT05,LT06,LT07,LT08,LT09,LT10,LT11,LT12,LT13,CP01,CP02,CP03,CP04,CP05,AL01,AL02,AL03,AL04,AL05
          - --config=.sqlfluff
        files: ^scripts/bigquery/.*\.sql$
        additional_dependencies: []

  # ============================================================================
  # FASE 4: PYTHON CODE QUALITY (8-12s)
  # Mantém configuração existente
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-check
        name: Lint Python with Ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: Format Python with Ruff
        args: [--line-length, "100"]

  # ============================================================================
  # PHASE 4.5: TYPE CHECKING (3-5s)
  # Habilitado apenas para módulos core sem erros de tipo
  # TODO: Expandir gradualmente para outros módulos após correções
  # ============================================================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        name: Type check with mypy (core modules only)
        args: [--strict, --ignore-missing-imports, --follow-imports=silent]
        # Apenas módulos core que passam mypy strict sem erros
        files: ^src/data_platform/(config|models/(__init__|news))\.py$
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - pydantic
          - pydantic-settings

  # ============================================================================
  # FASE 5: CUSTOM VALIDATORS (< 2s)
  # Validação específica do projeto
  # ============================================================================
  - repo: local
    hooks:
      - id: validate-feature-registry
        name: Validate feature_registry.yaml schema
        entry: python scripts/validate_feature_registry.py
        language: system
        files: ^feature_registry\.yaml$
        pass_filenames: false
